<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二次元出图工作台（Illustrious）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #1a0f2e; color: #ece7f5; min-height: 100vh; }
  header { padding: 14px 24px; background: #2a1a4a; border-bottom: 1px solid #4a3a6a; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #1e3a5f; color: #93c5fd; }
  #tabs { display: flex; gap: 8px; padding: 14px 24px 0; }
  .tab { background: #2a1a4a; border: 1px solid #4a3a6a; color: #b8a8d8; border-radius: 10px 10px 0 0; padding: 10px 22px; cursor: pointer; font-size: 14px; }
  .tab.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
  #main { max-width: 1000px; margin: 0 auto; padding: 20px 24px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #2a1a4a; border: 1px solid #4a3a6a; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h3 { font-size: 15px; margin-bottom: 12px; color: #c4b5fd; }
  label { display: block; font-size: 13px; color: #b8a8d8; margin: 10px 0 4px; }
  textarea { width: 100%; background: #170b2b; color: #ece7f5; border: 1px solid #4a3a6a; border-radius: 10px; padding: 12px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; }
  input[type=text], input[type=number] { background: #170b2b; color: #ece7f5; border: 1px solid #4a3a6a; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .row label { margin: 0; }
  button { background: #8b5cf6; color: #fff; border: none; border-radius: 10px; padding: 10px 30px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 14px; }
  button:hover { background: #7c3aed; }
  button:disabled { background: #4a3a6a; cursor: not-allowed; }
  .status { font-size: 13px; color: #a78bfa; margin-top: 10px; min-height: 20px; }
  .imgbox { background: #1d1135; border: 1px solid #4a3a6a; border-radius: 12px; padding: 12px; margin-top: 14px; }
  .imgbox .cap { font-size: 12px; color: #b8a8d8; margin-bottom: 8px; }
  .imgbox img { max-width: 100%; max-height: 420px; border-radius: 8px; display: block; }
  #refArea { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
  #refPreview { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 2px solid #8b5cf6; display: none; }
  .upload-btn { display: inline-block; background: #3a2a5a; color: #e2d8f5; border: 1px solid #4a3a6a; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .upload-btn:hover { background: #4a3a6a; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { background: #170b2b; border: 1px solid #4a3a6a; color: #b8a8d8; border-radius: 14px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: #8b5cf6; color: #fff; }
  .note { font-size: 12px; color: #9a8ab8; margin-top: 8px; line-height: 1.7; }
  .err { color: #fca5a5; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  input[type=range] { width: 200px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>🌸 二次元出图工作台（Illustrious XL）</h1>
  <span class="badge" id="bTask">任务: -</span>
</header>

<div id="tabs">
  <div class="tab active" data-t="t2i" onclick="switchTab('t2i')">🖼 文生图</div>
  <div class="tab" data-t="edit" onclick="switchTab('edit')">🎭 锁角色编辑</div>
</div>

<div id="main">
  <div class="panel active" id="pan-t2i">
    <div class="card">
      <h3>🖼 二次元文生图（Illustrious XL，角色质量强）</h3>
      <label>提示词（支持中文，自动理解）</label>
      <textarea id="t2i_prompt" placeholder="例如：黑发少女，白衬衫，樱花树下，微笑，二次元，精细刻画，高画质"></textarea>
      <div class="chips" id="t2i_chips"></div>
      <div class="row" style="margin-top:14px">
        <label>宽 <input type="number" id="t2i_w" value="832" style="width:90px"></label>
        <label>高 <input type="number" id="t2i_h" value="480" style="width:90px"></label>
        <label>步数 <input type="number" id="t2i_steps" value="25" style="width:80px"></label>
        <label>CFG <input type="number" id="t2i_cfg" value="7.0" step="0.1" style="width:80px"></label>
        <label>Seed <input type="text" id="t2i_seed" placeholder="留空随机" style="width:120px"></label>
      </div>
      <button onclick="runT2I()">🎨 生成图片</button>
      <div id="status_t2i" class="status"></div>
      <div id="result_t2i"></div>
    </div>
  </div>

  <div class="panel" id="pan-edit">
    <div class="card">
      <h3>🎭 锁角色编辑</h3>
      <div class="note">上传角色设定图 → 写编辑指令 → 保持角色外观重绘。
        <b>普通重绘</b>：denoise 越低越像原角色，但改姿势/构图能力弱；
        <b>IPAdapter 强锁</b>：角色特征注入，姿势/场景完全听指令（"站起来变全身"用这个）。</div>
      <div id="refArea">
        <label class="upload-btn" onclick="document.getElementById('edit_ref').click()">📤 上传参考图</label>
        <input type="file" id="edit_ref" accept="image/*" style="display:none" onchange="onRefChange(this)">
        <img id="refPreview" alt="参考图预览">
        <span id="refName" style="font-size:12px;color:#9a8ab8"></span>
      </div>
      <label>编辑指令</label>
      <textarea id="edit_prompt" placeholder="例如：让角色站起来，全身，站在海边，保持发型和服装不变"></textarea>
      <div class="row" style="margin-top:14px">
        <label>锁角色方式
          <select id="edit_mode" onchange="onModeChange()" style="background:#170b2b;color:#ece7f5;border:1px solid #4a3a6a;border-radius:6px;padding:6px 10px">
            <option value="ipadapter">IPAdapter 强锁（推荐，改姿势专用）</option>
            <option value="img2img">普通重绘（保细节）</option>
          </select>
        </label>
        <span id="paramWrap">
          <label id="denoiseLbl" style="display:none">denoise <input type="range" id="edit_denoise" min="0.35" max="0.85" step="0.05" value="0.55" oninput="document.getElementById('denoise_val').textContent=this.value"> <span id="denoise_val">0.55</span></label>
          <label id="weightLbl">角色强度 <input type="range" id="edit_weight" min="0.4" max="1.2" step="0.05" value="0.85" oninput="document.getElementById('weight_val').textContent=this.value"> <span id="weight_val">0.85</span></label>
        </span>
        <label>步数 <input type="number" id="edit_steps" value="25" style="width:80px"></label>
        <label>CFG <input type="number" id="edit_cfg" value="7.0" step="0.1" style="width:80px"></label>
        <label>Seed <input type="text" id="edit_seed" placeholder="留空随机" style="width:120px"></label>
      </div>
      <button onclick="runEdit()">🎭 生成编辑图</button>
      <div id="status_edit" class="status"></div>
      <div id="result_edit"></div>
    </div>
  </div>
</div>

<script>
const PRESETS = {
  t2i: ["黑发少女，白衬衫，樱花树下，微笑，二次元，精细刻画", "银发骑士少女，铠甲，月光下，剑士，二次元，高画质", "金发大小姐，欧式城堡，下午茶，傲娇表情，二次元"],
  edit: ["让角色坐在咖啡馆窗边喝拿铁，同样的发型服装，同样的脸", "让角色转过头微笑，特写，同样的服装", "给角色换上红色连衣裙，站在海边，同样的脸"],
};
const chipsEl = { t2i: 't2i_chips', edit: 'edit_chips' };
for (const k of Object.keys(chipsEl)) {
  const el = document.getElementById(chipsEl[k]);
  if (!el) continue;
  PRESETS[k].forEach(p => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = p;
    c.onclick = () => { document.getElementById(k + '_prompt').value = p; };
    el.appendChild(c);
  });
}

let refData = null;
let refName = '';
let pollTimer = null;

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.t === t));
  document.querySelectorAll('.panel').forEach(x => x.classList.toggle('active', x.id === 'pan-' + t));
}

function onRefChange(input) {
  const f = input.files[0];
  if (!f) return;
  refName = f.name;
  refData = f;
  const url = URL.createObjectURL(f);
  document.getElementById('refPreview').src = url;
  document.getElementById('refPreview').style.display = 'block';
  document.getElementById('refName').textContent = f.name;
}

function setStatus(tag, msg, cls) {
  const el = document.getElementById('status_' + tag);
  el.innerHTML = msg;
  el.className = cls || '';
}

function poll(id, tag, onDone) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const r = await fetch('/api/task?id=' + id);
    const t = await r.json();
    document.getElementById('bTask').textContent = '任务: ' + t.status + (t.status === 'running' ? ' ' + (t.message || '') : '');
    if (t.status === 'done' || t.status === 'error') {
      clearInterval(pollTimer);
      onDone(t);
    }
  }, 2500);
}

async function runT2I() {
  const body = {
    prompt: document.getElementById('t2i_prompt').value.trim(),
    width: +document.getElementById('t2i_w').value || 832,
    height: +document.getElementById('t2i_h').value || 480,
    steps: +document.getElementById('t2i_steps').value || 25,
    cfg: +document.getElementById('t2i_cfg').value || 7.0,
    seed: document.getElementById('t2i_seed').value.trim() || null,
  };
  if (!body.prompt) { setStatus('t2i', '请先输入提示词', 'err'); return; }
  setStatus('t2i', '⏳ 生成中（首次加载模型约 1 分钟）…');
  const r = await fetch('/api/t2i', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  poll(j.id, 't2i', t => {
    if (t.status === 'error') { setStatus('t2i', '❌ ' + t.message, 'err'); return; }
    setStatus('t2i', '✅ 生成完成');
    document.getElementById('result_t2i').innerHTML =
      `<div class="imgbox"><div class="cap">Illustrious · ${body.width}x${body.height} · ${body.steps}步</div><img src="${t.result}?t=${Date.now()}"></div>`;
  });
}

function onModeChange() {
  const mode = document.getElementById('edit_mode').value;
  document.getElementById('denoiseLbl').style.display = mode === 'img2img' ? '' : 'none';
  document.getElementById('weightLbl').style.display = mode === 'ipadapter' ? '' : 'none';
}

async function runEdit() {
  const prompt = document.getElementById('edit_prompt').value.trim();
  if (!refData) { setStatus('edit', '请先上传参考图', 'err'); return; }
  if (!prompt) { setStatus('edit', '请先输入编辑指令', 'err'); return; }
  const mode = document.getElementById('edit_mode').value;
  setStatus('edit', '⏳ 生成中（' + (mode === 'ipadapter' ? 'IPAdapter 强锁角色' : '普通重绘') + '）…');
  const fd = new FormData();
  fd.append('image', refData, refName);
  fd.append('prompt', prompt);
  fd.append('mode', mode);
  fd.append('denoise', document.getElementById('edit_denoise').value);
  fd.append('weight', document.getElementById('edit_weight').value);
  fd.append('steps', document.getElementById('edit_steps').value || '25');
  fd.append('cfg', document.getElementById('edit_cfg').value || '7.0');
  const seed = document.getElementById('edit_seed').value.trim();
  if (seed) fd.append('seed', seed);
  const r = await fetch('/api/edit', { method: 'POST', body: fd });
  const j = await r.json();
  if (j.error) { setStatus('edit', '❌ ' + j.error, 'err'); return; }
  poll(j.id, 'edit', t => {
    if (t.status === 'error') { setStatus('edit', '❌ ' + t.message, 'err'); return; }
    setStatus('edit', '✅ 编辑完成');
    document.getElementById('result_edit').innerHTML =
      `<div class="imgbox"><div class="cap">编辑结果（denoise ${document.getElementById('edit_denoise').value}）</div><img src="${t.result}?t=${Date.now()}"></div>`;
  });
}
</script>
</body>
</html>
