name: ai-video-studio

services:
  ollama:
    image: ollama/ollama:latest
    container_name: avs-ollama
    volumes:
      - ./models/ollama:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_KEEP_ALIVE=30m
    # 资源限制：限制 CPU 核数，防止转写/推理抢满主机（GPU 推理不受影响）
    deploy:
      resources:
        limits:
          cpus: "4.0"
    ports:
      - "11434:11434"
    restart: unless-stopped

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    image: avs-analyzer:latest
    container_name: avs-analyzer
    depends_on:
      - ollama
    environment:
      - VLM_BASE_URL=http://ollama:11434/v1
      - VLM_MODEL=${VLM_MODEL:-qwen2.5vl:3b}
      - NUM_CTX=${NUM_CTX:-8192}
      - ASR_MODEL=faster-whisper-small
      - WHISPER_MODEL_DIR=/models/whisper
      - FACE_ENABLED=false
      - MAX_FRAMES_PER_SCENE=2
      - MAX_SCENES=16
      - MATERIALS_DIR=/materials
    volumes:
      - ../素材:/materials
      - ./models:/models:ro
    # 资源限制：限制 CPU 核数与内存，防止分析（场景检测/转写）吃满主机导致过热
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    ports:
      - "8001:8001"
    restart: unless-stopped

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    image: avs-executor:latest
    container_name: avs-executor
    environment:
      - MATERIALS_DIR=/materials
      - OUTPUT_DIR=/output
    volumes:
      - ../素材:/materials
      - ./output:/output
      - ./config:/config:ro
    ports:
      - "8002:8002"
    restart: unless-stopped

  planner:
    build:
      context: .
      dockerfile: services/planner/Dockerfile
    image: avs-planner:latest
    container_name: avs-planner
    depends_on:
      - analyzer
      - executor
    environment:
      - PLANNER_BASE_URL=${PLANNER_BASE_URL:-http://ollama:11434/v1}
      - PLANNER_MODEL=${PLANNER_MODEL:-qwen2.5vl:3b}
      - PLANNER_API_KEY=${PLANNER_API_KEY:-}
      - ANALYZER_URL=http://analyzer:8001
      - EXECUTOR_URL=http://executor:8002
      - MATERIALS_DIR=/materials
    volumes:
      - ../素材:/materials
      - ./config:/config:ro
    ports:
      - "8003:8003"
    restart: unless-stopped
